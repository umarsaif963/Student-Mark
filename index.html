<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Marks Manager</h1>
        <p class="subtitle">Add students one by one, then show the results</p>

        <form id="marksForm" class="add-form">
            <div class="input-group">
                <label for="nameInput">Student Name</label>
                <input type="text" id="nameInput" placeholder="e.g. Ali" required>
            </div>
            <div class="input-group">
                <label for="marksInput">Marks</label>
                <input type="number" id="marksInput" min="0" max="100" placeholder="e.g. 85" required>
            </div>
            <button type="submit" id="addBtn" class="btn btn-add"><span class="plus">+</span> Add</button>
        </form>

        <div id="studentList" class="student-list"></div>

        <button id="resultBtn" class="btn" disabled>Show Result</button>

        <div id="results" class="results hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
